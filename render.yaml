services:
  # AscendiaOS NestJS API Service
  - type: web
    name: ascendiaos-api
    env: node
    plan: free
    buildCommand: pnpm install && pnpm build:api
    startCommand: pnpm start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001

  # AscendiaOS Next.js Web Client Service
  - type: web
    name: ascendiaos-web
    env: node
    plan: free
    buildCommand: pnpm install && pnpm build:web
    startCommand: pnpm start:web
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
